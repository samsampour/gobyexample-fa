name: deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4

    # Example pages are generated without an extension (e.g. "hello-world").
    # GitHub Pages serves "hello-world.html" for the "hello-world" URL, so we
    # rename them to keep every link working unchanged.
    - name: Prepare site
      run: |
        cp -r public site
        cd site
        for f in *; do
          case "$f" in
            *.*) ;;
            *) mv "$f" "$f.html" ;;
          esac
        done

    - uses: actions/configure-pages@v5

    - uses: actions/upload-pages-artifact@v3
      with:
        path: site

    - id: deployment
      uses: actions/deploy-pages@v4
